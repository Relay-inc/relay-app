<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Relay</title>
  <style>
    body { font: 15px -apple-system, system-ui, sans-serif; margin: 0; padding: env(safe-area-inset-top) 12px 12px; }
    input, button { font: inherit; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #f4f4f4; padding: 8px; max-height: 40vh; overflow: auto; }
    .row { display: flex; gap: 6px; } .row > * { flex: 1; }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } pre { background: #222; } }
  </style>
</head>
<body>
  <h3>Relay (test page)</h3>
  <details id="pairing"><summary>Pair</summary>
    <input id="line" placeholder="relay://host:47800#fp=…&code=…&key=…" autocapitalize="off" autocorrect="off">
    <button id="pair">Pair</button>
  </details>
  <button id="refresh">Refresh</button>
  <div id="convs"></div>
  <input id="key" placeholder="conversation" autocapitalize="off">
  <input id="msg" placeholder="message">
  <div class="row"><button id="open">Open</button><button id="send">Send</button><button id="stop">Stop</button></div>
  <div id="cards"></div>
  <h4>Events</h4><pre id="log"></pre>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const $ = id => document.getElementById(id);
    const log = s => { $('log').textContent = s + '\n' + $('log').textContent.slice(0, 30000); };
    const call = async (cmd, args) => { try { return await invoke(cmd, args); } catch (e) { log(`${cmd}: ${e}`); throw e; } };
    const key = () => $('key').value.trim();

    async function refresh() {
      const info = await call('info');
      log(`server ${info.host} v${info.version}, mirror ${info.mirror_open ? 'open' : 'locked'}`);
      const convs = await call('conversations');
      $('convs').replaceChildren(...convs.map(c => {
        const b = document.createElement('button');
        b.textContent = `${c.key} · ${c.model || 'default'}${c.sid ? '' : ' · no session yet'}`;
        b.onclick = () => { $('key').value = c.key; };
        return b;
      }));
      await cards();
    }
    async function cards() {
      const list = await call('pending');
      $('cards').replaceChildren(...list.map(r => {
        const d = document.createElement('div');
        d.innerHTML = `<b>${r.tool_name}</b> in ${r.project}: <code></code>`;
        d.querySelector('code').textContent = JSON.stringify(r.input);
        for (const [label, decision] of [['Allow', { behavior: 'allow' }], ['Deny', { behavior: 'deny' }]]) {
          const b = document.createElement('button');
          b.textContent = label;
          b.onclick = async () => { await call('answer', { id: r.id, decision }); cards(); };
          d.append(b);
        }
        return d;
      }));
    }

    $('pair').onclick = async () => { const r = await call('pair', { line: $('line').value.trim(), name: 'phone' }); log(`paired with ${r.info.host}`); refresh(); };
    $('refresh').onclick = refresh;
    $('open').onclick = async () => {
      const items = await call('history', { project: key() });
      log(`history: ${items.length} items`);
      await call('open', { project: key() });
      log(`following ${key()}`);
    };
    $('send').onclick = async () => { await call('send', { project: key(), text: $('msg').value, model: 'haiku' }); log(`sent to ${key()}`); $('msg').value = ''; };
    $('stop').onclick = async () => { await call('stop', { project: key() }); log(`stopped ${key()}`); };
    listen('agent', e => {
      const ev = e.payload.event;
      const text = ev.type === 'text' ? ev.text : ev.type === 'tool_call' ? `${ev.name} ${JSON.stringify(ev.input)}` : '';
      log(`[${e.payload.project}] ${ev.type} ${text}`.slice(0, 300));
      if (ev.type === 'permission' || ev.type === 'turn_end') cards();
    });
    refresh().catch(() => {});
  </script>
</body>
</html>
