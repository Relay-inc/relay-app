# The app (src-tauri) and the integration packages (packages/*: board-core and one crate per tracker).
[workspace]
members = ["src-tauri", "packages/*"]
resolver = "2"

[workspace.dependencies]
serde_json = "1"
board-core = { path = "packages/board-core" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
