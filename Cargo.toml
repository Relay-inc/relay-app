# The app (src-tauri) and the packages (packages/*: board-core and one crate per tracker, agent-core and one crate per agent).
[workspace]
members = ["src-tauri", "mobile/src-tauri", "packages/*"]
# a Node package, not a crate (packages/*  would otherwise ask for its Cargo.toml)
exclude = ["packages/plugin-example"]
resolver = "2"

# Relay's version, for the app and relay-server alike (a machine reports it), the same as package.json
[workspace.package]
version = "0.0.38"

[workspace.dependencies]
serde_json = "1"
board-core = { path = "packages/board-core" }
agent-core = { path = "packages/agent-core" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# mac-notification-sys 0.6.15 with an autorelease pool per pass of its click wait, else every pass (10 a second)
# leaks a copy of the delivered banners: src-tauri/vendor/mac-notification-sys/objc/notify.m. Drop once upstream has it.
[patch.crates-io]
mac-notification-sys = { path = "src-tauri/vendor/mac-notification-sys" }
