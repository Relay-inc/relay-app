# The app (src-tauri) and the packages (packages/*: board-core and one crate per tracker, agent-core and one crate per agent).
[workspace]
members = ["src-tauri", "packages/*"]
resolver = "2"

# Relay's version, for the app and relay-server alike (a machine reports it), the same as package.json
[workspace.package]
version = "0.0.14"

[workspace.dependencies]
serde_json = "1"
board-core = { path = "packages/board-core" }
agent-core = { path = "packages/agent-core" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
