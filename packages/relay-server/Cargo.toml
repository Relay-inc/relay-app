[package]
name = "relay-server"
version.workspace = true
edition = "2021"
description = "Runs Relay's agent conversations on a machine in the LAN; the app connects over mutual TLS with pinned certificates"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
relay-remote = { path = "../relay-remote" }
agent-core.workspace = true
agent-claude = { path = "../agent-claude" }
ring = "0.17"
libc = "0.2"
# the release signature an update from a vault admin must carry (upgrade.rs): both already in the tree via Tauri and agent-core
minisign-verify = "0.2"
base64 = "0.23"

[dev-dependencies]
# the e2e test edits a shared vault document the way an editor would (docs.rs)
yrs = "0.28"
