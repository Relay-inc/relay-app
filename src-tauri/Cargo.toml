[package]
name = "vault"
version = "0.1.0"
description = "Vault control room"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tauri-plugin-dialog = "2"
sys-locale = "0.3.2"
chrono = "0.4"
sha1_smol = "1"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# the board integrations, registered in src/providers.rs (PROVIDERS)
board-core.workspace = true
integration-productive = { path = "../packages/integration-productive" }
integration-trello = { path = "../packages/integration-trello" }
integration-linear = { path = "../packages/integration-linear" }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros"] }
mail-parser = "0.11"
ammonia = "4"
futures = "0.3"
base64 = "0.23"

