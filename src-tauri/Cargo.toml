[package]
name = "relay"
version.workspace = true
description = "Relay control room"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["whisper"]
# Whisper in dictation and meetings (src/dictation.rs). Off only for the Windows cross-check from a Mac
# (docs/development.md), which cannot generate whisper.cpp's bindings without Windows' C headers
whisper = ["transcribe-rs/whisper-cpp"]
# a self-test of the work machines inside the app (src/selftest.rs), run by packages/relay-server/docker/selftest.sh
selftest = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# file system events for open pages and the Pages tab (src/watch.rs)
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "unstable"] }
# the tray menu (src/tray.rs), same version as tauri's tray-icon
muda = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tauri-plugin-dialog = "2"
sys-locale = "0.3.2"
chrono = "0.4"
regex = "1"
libc = "0.2"
sha1_smol = "1"
# the favicon run (src/favicon.rs): domains in notes, accents folded, icon links resolved
unicode-normalization = "0.1"
url = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# the board integrations, registered in src/providers.rs (PROVIDERS)
board-core.workspace = true
integration-productive = { path = "../packages/integration-productive" }
integration-trello = { path = "../packages/integration-trello" }
integration-linear = { path = "../packages/integration-linear" }
integration-buddy = { path = "../packages/integration-buddy" }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros"] }
mail-parser = "0.11"
ammonia = "4"
futures = "0.3"
base64 = "0.23"
# the calendar feeds (src/calendar.rs): recurring meetings and their time zones
rrule = "0.14"
chrono-tz = "0.10"
# the shells of the embedded terminals (src/pty.rs)
portable-pty = "0.9"
# dictation in the composer (src/dictation.rs): the microphone, Parakeet speech to text on ONNX Runtime, and Whisper on
# whisper.cpp through the `whisper` feature (on the CPU, Metal is added for macOS below). whisper.cpp is C++ built by
# cmake: MSVC and cmake on Windows.
# ponytail: CPU only on Windows. Vulkan (`whisper-vulkan`) needs the Vulkan SDK and VULKAN_SDK on the build machine
cpal = "0.18"
transcribe-rs = { version = "0.3.12", features = ["onnx"] }
# the downloaded speech model's SHA-256 (src/dictation.rs)
sha2 = "0.10"
# the meeting recordings (src/meeting.rs): their tracks on disk
hound = "3"

# the broker and the link to a work machine (src/machines.rs, packages/relay-server)
relay-remote = { path = "../packages/relay-remote" }

# the agent providers, registered in src/agents.rs (PROVIDERS)
agent-core.workspace = true
agent-claude = { path = "../packages/agent-claude" }
agent-codex = { path = "../packages/agent-codex" }
agent-opencode = { path = "../packages/agent-opencode" }
agent-pi = { path = "../packages/agent-pi" }
tauri-plugin-deep-link = "2"
# dictation in any app: the shortcut registered with macOS (src/anywhere.rs)
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-updater = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

# Windows: a second start and a relay:// link go to the running window (src/lib.rs run), toasts for a finished turn or a
# waiting card (src/notify.rs)
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-notification = "2"
# whether the microphone is switched off in Windows' privacy settings (src/permissions.rs), and dictation's paste:
# the clipboard, Ctrl+V and the window in front (src/anywhere.rs)
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# a picture of the Design drawer's WebView2 (src/design.rs), the versions tauri's wry uses
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com_StructuredStorage"] }
# a vault's `.claude -> System` link as a directory junction, which needs no admin rights (src/platform.rs)
junction = "2"
# a folder's real path without the `\\?\` std adds (src/platform.rs same_dir)
dunce = "1"
# secrets in Credential Manager on Windows (src/secrets.rs). The Mac keeps /usr/bin/security, which made its entries
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

# the red menu bar title when a reminder is overdue (src/tray.rs), same versions as tauri's tray-icon
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# a picture of the Design drawer's webview for relay-design (src/design.rs)
objc2-web-kit = "0.3"
block2 = "0.6"
# the tap on what the Mac plays, for recording meetings (src/meeting.rs)
objc2-core-audio = "0.3"
objc2-core-foundation = "0.3"
# banners for a finished turn or a waiting card (src/notify.rs), with the click coming back to the app
mac-notification-sys = "0.6"
# Whisper on the Mac's GPU: whisper.cpp on Metal (src/dictation.rs)
transcribe-rs = { version = "0.3.12", features = ["whisper-metal"] }

# this computer as a work machine: the app runs relay-server itself (`relay --relay-server`), under a LaunchAgent on a
# Mac (src/host.rs) and a scheduled task on Windows (src/host_windows.rs)
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
relay-server = { path = "../packages/relay-server" }
