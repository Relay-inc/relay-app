<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault</title>
<style>
:root{
  --bg:#FFFFFF; --sidebar:#EFEEED; --inspector:#F7F6F5;
  --label:rgba(0,0,0,.85); --secondary:rgba(0,0,0,.50); --separator:rgba(0,0,0,.10);
  --fill:rgba(0,0,0,.05); --accent:#007AFF; --on-accent:#FFFFFF;
  --r:8px; --ease:ease-out; --d:150ms;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E1E1E; --sidebar:#2A2A2A; --inspector:#242424;
  --label:rgba(255,255,255,.85); --secondary:rgba(255,255,255,.55); --separator:rgba(255,255,255,.10);
  --fill:rgba(255,255,255,.07); --accent:#0A84FF;
}}
:root[data-theme=dark]{
  --bg:#1E1E1E; --sidebar:#2A2A2A; --inspector:#242424;
  --label:rgba(255,255,255,.85); --secondary:rgba(255,255,255,.55); --separator:rgba(255,255,255,.10);
  --fill:rgba(255,255,255,.07); --accent:#0A84FF;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.4 var(--sans);color:var(--label);background:var(--bg);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:240px minmax(0,1fr) 300px;min-width:900px}
button{font:inherit;color:inherit}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* sidebar */
aside.side{background:var(--sidebar);border-right:1px solid var(--separator);display:flex;flex-direction:column;min-height:0;padding-top:44px}
.search{margin:0 12px 10px;height:28px;border-radius:var(--r);background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--secondary)}
.search input{all:unset;flex:1;color:var(--label);font-size:13px}
.search input::placeholder{color:var(--secondary)}
.nav{overflow-y:auto;padding:0 10px 16px;flex:1}
.grp{font-size:11px;font-weight:600;color:var(--secondary);padding:14px 8px 4px;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:calc(var(--r) - 2px);cursor:default;transition:background-color var(--d) var(--ease)}
.row:hover{background:var(--fill)}
.row.sel{background:var(--accent);color:var(--on-accent)}
.row .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row.new .nm{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.row.sel .dot{background:var(--on-accent)}
.badge{min-width:18px;height:16px;padding:0 5px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:grid;place-items:center}
.count{color:var(--secondary);font-variant-numeric:tabular-nums}
.spin{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--separator);border-top-color:var(--secondary);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.fold{color:var(--secondary)}

/* conversation */
section.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--separator)}
.bar h1{font-size:15px;font-weight:600}
.bar .sub{color:var(--secondary)}
.bar .sp{flex:1}
.tb{height:26px;padding:0 10px;border-radius:var(--r);border:0;background:transparent;color:var(--secondary);cursor:default;transition:background-color var(--d) var(--ease)}
.tb:hover{background:var(--fill);color:var(--label)}
.log{flex:1;overflow-y:auto;padding:24px 0 8px}
.msgs{max-width:720px;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;gap:18px}
.me{align-self:flex-end;max-width:80%;background:var(--fill);border-radius:var(--r);padding:9px 14px;font-size:16px;line-height:1.45}
.ai{font-size:16px;line-height:1.55}
.ai p+p{margin-top:10px}
.ai b{font-weight:600}
.tool{display:flex;align-items:center;gap:8px;color:var(--secondary);font-size:13px;margin:-6px 0}
.tool::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;opacity:.6}
.tool code,.perm code{font-family:var(--mono);font-size:12.5px}
.perm{border:1px solid var(--accent);border-radius:var(--r);background:var(--fill);padding:12px 14px;display:grid;gap:10px}
.perm .q{font-size:13px;color:var(--secondary)}
.perm pre{font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:var(--label)}
.perm .acts{display:flex;justify-content:flex-end;gap:8px}
.btn{height:28px;padding:0 14px;border-radius:var(--r);border:1px solid var(--separator);background:var(--bg);cursor:default;transition:filter var(--d) var(--ease)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:focus-visible,.tb:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
.composer{flex:none;max-width:720px;width:calc(100% - 56px);margin:8px auto 20px;border-radius:var(--r);background:var(--bg);
  box-shadow:0 0 0 .5px var(--separator),0 1px 2px rgba(0,0,0,.06);border:1px solid var(--separator);padding:10px 12px 8px}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{all:unset;display:block;width:100%;min-height:24px;font-size:16px;line-height:1.45;color:var(--label)}
.composer textarea::placeholder{color:var(--secondary)}
.cfoot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--secondary)}
.cfoot label{display:flex;align-items:center;gap:6px}
.cfoot .sp{flex:1}
.send{width:26px;height:26px;border-radius:var(--r);border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}

/* inspector */
aside.insp{background:var(--inspector);border-left:1px solid var(--separator);display:flex;flex-direction:column;min-height:0}
.insp .bar{border-bottom:1px solid var(--separator)}
.seg{display:flex;background:var(--fill);border-radius:var(--r);padding:2px}
.seg button{height:22px;padding:0 12px;border:0;border-radius:calc(var(--r) - 2px);background:transparent;color:var(--secondary)}
.seg button.on{background:var(--bg);color:var(--label);box-shadow:0 0 0 .5px var(--separator)}
.ibody{overflow-y:auto;padding:16px 18px 24px}
.ibody h2{font-size:13px;font-weight:600;margin:0 0 8px}
.stand p{font-size:13px;line-height:1.5}
.stand p+p{margin-top:8px}
.meta{color:var(--secondary);margin-bottom:12px}
.todo{list-style:none;padding:0}
.todo li{display:grid;grid-template-columns:16px 1fr;align-items:start;gap:8px;padding:7px 0;border-bottom:1px solid var(--separator);font-size:13px;line-height:1.4}
.todo input{margin:2px 0 0;accent-color:var(--accent)}
.more{color:var(--secondary);margin-top:10px}
.todo .tx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:1100px){body{grid-template-columns:220px minmax(0,1fr)} aside.insp{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<aside class="side">
  <label class="search"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input placeholder="Zoek project of gesprek"></label>
  <nav class="nav" id="nav"></nav>
</aside>

<section class="chat">
  <div class="bar"><h1 id="t"></h1><span class="sub" id="ts"></span><span class="sp"></span>
    <button class="tb">Nieuw gesprek</button><button class="tb">Openen in Terminal</button></div>
  <div class="log"><div class="msgs" id="msgs"></div></div>
  <div class="composer">
    <textarea rows="1" id="c"></textarea>
    <div class="cfoot"><label><input type="checkbox"> Op de achtergrond</label><span class="sp"></span>
      <button class="send" aria-label="Versturen"><svg class="i" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></svg></button></div>
  </div>
</section>

<aside class="insp">
  <div class="bar"><div class="seg"><button class="on">Open</button><button>Stand</button><button>Reminders</button></div></div>
  <div class="ibody" id="insp"></div>
</aside>

<script id="data" type="application/json">__SNAPSHOT__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
const SEL = 'Weemaes';

// which projects need Laurent, work, or finished since he last looked, from claude agents --json
const names = D.projects.map(p => p.name).sort((a, b) => b.length - a.length);
const projOf = t => names.find(n => new RegExp(`(^|[^\\p{L}])${n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^\\p{L}]|$)`, 'iu').test(t || ''));
const flags = {};
for (const s of D.sessions.items) {
  const p = projOf(s.name); if (!p) continue;
  if (s.state === 'blocked') flags[p] = 'wait';
  else if (s.status === 'busy' && flags[p] !== 'wait') flags[p] = 'busy';
  else if (s.state === 'done' && !flags[p]) flags[p] = 'done';
}
const waiting = Object.values(flags).filter(f => f === 'wait').length;

const row = (name, trail, cls = '') => `<div class="row ${cls}"><span class="nm">${esc(name)}</span>${trail}</div>`;
const trailOf = n => flags[n] === 'wait' ? '<span class="dot"></span>' : flags[n] === 'busy' ? '<span class="spin"></span>' : '';
let nav = row('Wacht op jou', waiting ? `<span class="badge">${waiting}</span>` : '') + row('Algemeen', '');
for (const c of ['Antenna', 'Meersman', 'Personal']) {
  const live = D.projects.filter(p => p.context === c && ['Active', 'Blocked'].includes(p.state));
  const quiet = D.projects.filter(p => p.context === c).length - live.length;
  nav += `<div class="grp">${c.toUpperCase()}</div>` + live.map(p =>
    row(p.name, trailOf(p.name), [p.name === SEL ? 'sel' : '', flags[p.name] === 'done' ? 'new' : ''].join(' '))).join('')
    + (quiet ? row(`Stil (${quiet})`, '', 'fold') : '');
}
$('nav').innerHTML = nav;

// conversation, the selected project
const P = D.projects.find(p => p.name === SEL);
$('t').textContent = P.name;
$('ts').textContent = `${P.state === 'Active' ? 'Actief' : P.state} · ${P.open ?? 0} open`;
const paras = (P.stand || '').split(/\n\s*\n/).filter(Boolean);
$('msgs').innerHTML = `
  <div class="me">waar staan we met weemaes</div>
  <div class="tool">Weemaes.md, Session Log en reminders gelezen</div>
  <div class="ai">${paras.map(p => `<p>${md(p)}</p>`).join('')}</div>
  <div class="me">merge #741 als de checks groen zijn</div>
  <div class="tool"><code>gh pr checks 741</code> uitgevoerd, alles groen</div>
  <div class="perm"><div class="q">Claude wil dit uitvoeren in weemaes-backend. Dit ziet iemand anders, dus het wacht op jou.</div>
    <pre>gh pr merge 741 --squash</pre>
    <div class="acts"><button class="btn">Weigeren</button><button class="btn primary">Toestaan</button></div></div>`;
$('c').placeholder = `Vraag iets over ${P.name}…`;

// inspector: straight from the note, what is open first
const items = P.open_items || [];
const rem = D.reminders.filter(r => r.project === P.name);
const when = r => r.days < 0 ? `${-r.days} d vervallen` : r.days === 0 ? 'vandaag' : `over ${r.days} d`;
$('insp').innerHTML = (rem.length ? `<h2>Reminders</h2><ul class="todo">${rem.map(r => `<li><input type="checkbox"><span><span class="tx">${md(r.title)}</span><span class="count">${when(r)}</span></span></li>`).join('')}</ul>` : '')
  + `<h2 style="margin-top:${rem.length ? 22 : 0}px">Open <span class="count">${items.length}</span></h2>
  <ul class="todo">${items.slice(0, 12).map(i => `<li><input type="checkbox"><span class="tx">${md(i)}</span></li>`).join('')}</ul>
  ${items.length > 12 ? `<div class="more">Nog ${items.length - 12}</div>` : ''}`;
document.querySelector('.log').scrollTop = 1e6;
</script>
</body>
</html>
