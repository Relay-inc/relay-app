# Every PR updates CHANGELOG.md, unless it carries the skip-changelog label.
name: changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  changelog:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: CHANGELOG.md changed
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx CHANGELOG.md \
            || { echo "::error file=CHANGELOG.md::Add a line under Unreleased, or label the PR skip-changelog."; exit 1; }
