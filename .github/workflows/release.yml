# A new version on main is a release: when package.json's version has no tag yet, build Relay for macOS and publish it
# as GitHub release v<version>, its notes the version's section of CHANGELOG.md, and push the relay-server image of the
# same version. Run it by hand to retry a failed one; once the release exists, re-run the failed job instead.
name: release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      new: ${{ steps.check.outputs.new }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$version" = "$cargo" ] || { echo "::error::package.json is $version, src-tauri/Cargo.toml is $cargo"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes=$(scripts/changelog-section.sh "$version") || { echo "::error file=CHANGELOG.md::No section for $version"; exit 1; }
          {
            echo "new=true"
            echo "notes<<RELAY_NOTES"
            echo "$notes"
            echo
            echo "---"
            echo "Relay is not signed by Apple yet: after moving it to Applications, run"
            echo '`xattr -dr com.apple.quarantine /Applications/Relay.app` once, or macOS says it is damaged.'
            echo "RELAY_NOTES"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    # Apple silicon; an Intel or universal build is another target in `args`
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: Relay ${{ needs.version.outputs.version }}
          releaseBody: ${{ needs.version.outputs.notes }}
          releaseDraft: false
          prerelease: false

  # relay-server for work machines (packages/relay-server), tagged with the app's version so both speak the same
  # protocol. arm64 builds under QEMU: slower, but no second runner.
  server-image:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relay-server/docker/Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/laurentme/relay-server:${{ needs.version.outputs.version }}
            ghcr.io/laurentme/relay-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
