# The frontend's gates on every PR and on main: types, tests, lint (layer boundaries included), the React Compiler
# compiling every component, and formatting.
name: frontend
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm check:compiler
      - run: pnpm format:check
      - run: pnpm exec vite build
