<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vault</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <script type="module" src="/src/main.ts" defer></script>
</head>
<body>
  <aside class="side">
    <div class="drag" data-tauri-drag-region></div>
    <label class="search"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="find" placeholder="Zoek project"></label>
    <nav class="nav" id="nav"></nav>
  </aside>
  <section class="chat">
    <div class="bar" data-tauri-drag-region><h1 id="t"></h1><span class="sub" id="ts"></span><span class="sp" data-tauri-drag-region></span>
      <button class="tb" id="new">Nieuw gesprek</button><button class="tb" id="term">Openen in Terminal</button></div>
    <div class="log" id="log"><div class="msgs" id="msgs"></div></div>
    <div class="movebar" id="movebar" style="display:none"></div>
    <div class="composer" id="composer">
      <textarea rows="1" id="c"></textarea>
      <div class="cfoot"><span class="hint" id="hint"></span><span class="sp"></span>
        <button class="send" id="send" aria-label="Versturen"><svg class="i" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></svg></button></div>
    </div>
  </section>
  <aside class="insp">
    <div class="bar" data-tauri-drag-region><div class="seg" id="seg"><button data-tab="open" class="on">Open</button><button data-tab="stand">Stand</button><button data-tab="rem">Reminders</button></div></div>
    <div class="ibody" id="insp"></div>
  </aside>
</body>
</html>
